name: Update StayLatin Reviews

on:
  schedule:
    # Run every Sunday at 6 AM UTC (1 AM Chicago time)
    - cron: '0 6 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch latest reviews
        run: |
          node .github/workflows/fetch-reviews.js
        env:
          TRIP_API_KEY: ${{ secrets.TRIP_API_KEY }}
          EXPEDIA_API_KEY: ${{ secrets.EXPEDIA_API_KEY }}

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "StayLatin Review Bot"
          git add staylatin/index.html
          git commit -m "chore: update guest reviews from Expedia and Trip.com

- Automatically fetched latest reviews
- Updated review database with current guest feedback
- Ran at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.git-check.outputs.changed }}" = "true" ]; then
            echo "✅ Reviews updated and pushed to main"
          else
            echo "ℹ️ No new reviews found - site reviews are current"
          fi
