<body><main class="wrap"><section class="panel" data-account-role="traveler" data-account-mode="signin" data-destination="traveler.html#dashboard"><div class="kicker">Traveler access</div><h1>Welcome back</h1><p>Save favorite stays and organize your next Latin America trip.</p><p class="account-instruction">New to StayLatin? <a href="traveler-signup.html" target="_self">Create a free traveler account</a>.</p><form id="authForm"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" name="email" autocomplete="email" required placeholder="you@example.com"><label for="password">PASSWORD</label><input id="password" type="password" name="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"><button class="primary" id="submit" type="submit">Sign in to my traveler account</button></form><button type="button" id="resetPassword" class="minor">Email me a password-reset link</button><div class="status" id="status" role="status" hidden></div></section></main><script>var y=document.getElementById("year");if(y)y.textContent=new Date().getFullYear();</script><script src="staylatin-config.js?v=0d43971a7182"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="account-auth.js?v=0d43971a7182"></script>
<script id="staylatin-inline-account-switch">
(function(){
 function handleAccountSwitch(event){
  var link=event.target.closest(".account-instruction a");
  if(!link)return;
  event.preventDefault();
  event.stopPropagation();
  if(event.stopImmediatePropagation)event.stopImmediatePropagation();
  var destination=new URL(link.getAttribute("href"),window.location.href);
  try{
   if(window.parent!==window){
    var parentDoc=window.parent.document;
    var parentFrame=parentDoc.getElementById("staylatin-account-frame");
    var parentOverlay=parentDoc.getElementById("staylatin-account-overlay");
    if(parentFrame&&parentOverlay){
     parentFrame.src=destination.href;
     parentOverlay.hidden=false;
     parentOverlay.setAttribute("aria-hidden","false");
     return;
    }
   }
  }catch(e){}
  window.location.href=destination.href;
 }
 document.addEventListener("click",handleAccountSwitch,true);
})();
</script>
</body></html>
