<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your traveler space — StayLatin</title><link rel="stylesheet" href="account-auth.css"><style>
body{margin:0;background:#f6f3ec;color:#17372e;font-family:Arial,sans-serif}.top{background:#112e27;color:#fff;padding:14px 24px;letter-spacing:1px}.wrap{max-width:900px;margin:48px auto;padding:24px}.panel{background:white;border:1px solid #e4ddcf;border-radius:18px;padding:32px;box-shadow:0 8px 32px #172e2510}h1{margin:8px 0 12px}.muted{color:#5f6d65;line-height:1.6}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.links a,button{border:0;border-radius:8px;padding:12px 16px;background:#17372e;color:white;text-decoration:none;cursor:pointer;font-size:14px}.links a.secondary{background:#eee8dc;color:#17372e}.status{margin-top:16px;padding:12px;background:#f5eee2;border-radius:8px}
</style></head>
<body><div class="top">✳ STAYLATIN · TRAVELER SPACE</div><main class="wrap"><section class="panel"><p>YOUR TRAVEL ACCOUNT</p><h1 id="welcome">Loading your traveler space…</h1><p class="muted" id="description">Checking your secure sign-in session.</p><div id="status" class="status" hidden></div><div class="links"><a href="index.html#top">Explore StayLatin</a><a class="secondary" href="traveler-signin.html">Account sign in</a><button id="logout" hidden>Sign out</button></div></section></main>
<script src="staylatin-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const title=document.getElementById("welcome"),desc=document.getElementById("description"),status=document.getElementById("status"),logout=document.getElementById("logout");try{const cfg=window.STAYLATIN_SUPABASE_CONFIG;if(!cfg?.url||!cfg?.anonKey||!window.supabase?.createClient)throw new Error("The account service is temporarily unavailable. Please try again shortly.");const client=window.supabase.createClient(cfg.url,cfg.anonKey);const {data,error}=await client.auth.getSession();if(error)throw error;const session=data.session;if(!session){window.location.replace("traveler-signin.html");return;}const user=session.user;title.textContent="Welcome to your traveler space";desc.textContent="You are signed in as "+(user.email||"your traveler account")+". Your account is verified and your session is active.";status.hidden=false;status.textContent="Traveler sign-in successful.";logout.hidden=false;logout.addEventListener("click",async()=>{logout.disabled=true;const {error}=await client.auth.signOut();if(error){status.textContent=error.message;logout.disabled=false;return;}window.location.replace("traveler-signin.html");});}catch(e){title.textContent="We couldn't open your traveler space";desc.textContent="Please try signing in again.";status.hidden=false;status.textContent=e.message||"Unexpected account error.";}})();
</script></body></html>
