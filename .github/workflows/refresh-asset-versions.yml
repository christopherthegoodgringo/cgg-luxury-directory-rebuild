name: Refresh StayLatin asset versions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the current commit version to local CSS and JavaScript
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["ASSET_VERSION"][:12]
          changed = []
          attr = re.compile(r"""(?P<prefix>\b(?:src|href)\s*=\s*)(?P<quote>["'])(?P<url>.*?)(?P=quote)""", re.I)
          asset = re.compile(r'^(?![a-zA-Z][a-zA-Z0-9+.-]*:|//|#|data:)(?P<path>[^?#]+\.(?:js|css))(?P<query>\?[^#]*)?(?P<fragment>#.*)?$', re.I)

          for file in Path(".").rglob("*.html"):
              if ".git" in file.parts:
                  continue
              original = file.read_text(encoding="utf-8")
              def update(match):
                  url = match.group("url")
                  found = asset.match(url)
                  if not found:
                      return match.group(0)
                  path = found.group("path")
                  fragment = found.group("fragment") or ""
                  query = found.group("query") or ""
                  params = [part for part in query.lstrip("?").split("&") if part and not part.startswith("v=") and not part.startswith("refresh=")]
                  params.insert(0, "v=" + version)
                  return match.group("prefix") + match.group("quote") + path + "?" + "&".join(params) + fragment + match.group("quote")
              updated = attr.sub(update, original)
              if updated != original:
                  file.write_text(updated, encoding="utf-8")
                  changed.append(str(file))
          print("Updated asset versions in: " + (", ".join(changed) if changed else "no HTML files needed changes"))
          PY

      - name: Commit versioned asset references
        run: |
          if git diff --quiet; then
            echo "Asset references are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '**/*.html'
          git commit -m "Refresh asset cache versions"
          git push
