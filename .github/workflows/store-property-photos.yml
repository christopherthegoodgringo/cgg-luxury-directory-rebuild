name: Store StayLatin property photos
on:
  workflow_dispatch:
  push:
    paths:
      - 'staylatin/index.html'
      - '.github/workflows/store-property-photos.yml'
permissions:
  contents: write
jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download property-specific images
        run: |
          python3 - <<'PY'
          import os, urllib.request
          os.makedirs('staylatin/images', exist_ok=True)
          sources = {
            '4': ['https://images.trvl-media.com/lodging/114000000/113180000/113174800/113174713/580db296.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575','https://images.trvl-media.com/lodging/114000000/113180000/113174800/113174713/f8118fb9.jpg?h=800&impolicy=fcrop&quality=medium&w=1200','https://cf.bstatic.com/xdata/images/hotel/max1024x768/653556545.jpg?k=22157b4e8a0bd3eb2b02fafa2372a9f9a1b9d56ad0f80d038561ce53f10d104b&o='],
            '9': ['https://images.trvl-media.com/lodging/14000000/13270000/13265600/13265595/c8cf5e37.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575'],
            '10': ['https://cf.bstatic.com/xdata/images/hotel/max1024x768/445983647.jpg?hp=1&k=4ecf7b0c41d8009498c571149365170788b782c4b897c9c5dbee14408595f4e3&o=','https://cf.bstatic.com/xdata/images/hotel/max1024x768/452592748.jpg?k=de3988b42c6f10a90feaf0d54bbd85b837c1027a43712570ea5c77448e462a19&o='],
            '11': ['https://static.wixstatic.com/media/3dfff6_3cd1908b10d64b918e9e3d647f45c948~mv2.jpg/v1/fill/w_1256,h_798,al_c,q_85/Grupo%20Alma-07_edited.jpg'],
            '12': ['https://www.myboutiquehotel.com/photos/124461/casa-de-isabella-a-kali-hotel-co-001-37310-900x570.jpg','https://images.trvl-media.com/lodging/5000000/4600000/4598300/4598220/12e81823.jpg?h=800&impolicy=fcrop&quality=medium&w=1200'],
            '13': ['https://a.hwstatic.com/image/upload/f_auto%2Cq_auto%2Ct_40/propertyimages/3/339016/jr9nsvfi3tuicjjqde4g.jpg'],
            '14': ['https://hotelaristogold.com/wp-content/uploads/2024/06/apartahotel002.jpg'],
            '15': ['https://parque-santander.hoteles-en-boyaca.com/data/Images/OriginalPhoto/10801/1080143/1080143944/image-tunja-hotel-parque-santander-tunja-20.JPEG','https://cf.bstatic.com/xdata/images/hotel/max1024x768/121077546.jpg?hp=1&k=eee3891013db1e3d8008efbd24d2a2cd4a2bd7c784bbfcadd070ec5e99d1db0e&o=','https://images.trvl-media.com/lodging/11000000/10550000/10546600/10546540/ba434713.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575'],
            '3': ['https://images.squarespace-cdn.com/content/v1/5aa992560dbda3d41aafe674/1645659927058-OYCB21POYQ5Q9RXBTLTJ/Casa%2BAntonieta%2BHabitaciones52.jpg'],
            '2': ['https://mvtrading.net/wp-content/uploads/2023/08/LYP4320-min.jpg','https://webbox.imgix.net/images/hhgiyjerfztpxftr/4e983fec-f99b-4411-b210-24df5224f02f.jpg?auto=format%2Ccompress&crop=entropy&fit=crop&q=85&w=1200'],
            '1': ['https://www.eluniversal.com.co/resizer/v2/mg-73751000734120240503092826jpg-RH3JMPNWNVDTZAB2CLBKG7NRGI.jpg?auth=70c76fbaeb8e506f42448e4119fd4ab5ae64b195005f212e8c2b39e6ebe7c8f1&height=800&quality=70&smart=true&width=1200','https://www.casanoa.co/wp-content/uploads/2024/01/MG_7392-1-300x200.jpg'],
            '5': ['https://yucatan.travel/wp-content/uploads/2020/10/Casa-Lecanda-1-703x535.jpg','https://www.casalecanda.com/storage/cms/home/01KY46QD99FKV92X0F7XD5NJ8Y.png','https://media.admagazine.com/photos/618a8332fb71c632cb925225/master/w_1600%2Cc_limit/39603.jpg'],
            '6': ['https://www.journeylatinamerica.com/app/uploads/2026/03/sala-1024x683-c-center.jpg','https://casalegadobogota.com/wp-content/uploads/2024/11/Jardin-desde-arriba-605x465.jpg'],
            '7': ['https://www.hotelcasaloscantaros.com/home/wp-content/uploads/2023/02/restaurante-21.jpg','https://h-img1.cloudbeds.com/uploads/265960/los_cantaros-139_gallery~~650327fd6a007.jpg'],
            '8': ['https://dynamic-media-cdn.tripadvisor.com/media/photo-o/19/66/d8/65/mezcal-hotel-hostel-cancun.jpg?h=800&s=1&w=1400','https://www.mezcalboutiquehotel.com/assets/img/albercacenote.jpg']
          }
          for ident, urls in sources.items():
              dest = f'staylatin/images/{ident}.jpg'
              success = False
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 StayLatin-photo-archiver/1.0'})
                      with urllib.request.urlopen(req, timeout=25) as response:
                          data = response.read()
                          ctype = response.headers.get('Content-Type','').lower()
                      if len(data) > 8000 and (data[:3] == b'\xff\xd8\xff' or data[:8] == b'\x89PNG\r\n\x1a\n' or b'image/' in ctype):
                          with open(dest,'wb') as f: f.write(data)
                          print(f'Saved {dest} ({len(data)} bytes) from {url}')
                          success = True
                          break
                      print(f'Rejected non-image/too-small response for {ident} from {url}')
                  except Exception as e:
                      print(f'Failed {ident} source {url}: {e}')
              if not success:
                  print(f'WARNING: no image source worked for property ID {ident}')
          PY
      - name: Commit downloaded photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staylatin/images
          if git diff --cached --quiet; then
            echo "No new image files to commit"
          else
            git commit -m "Store StayLatin property photos locally"
            git push
          fi
